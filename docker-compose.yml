version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - agri-network

  frontend:
    build:
      context: ./croprecommender
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./croprecommender:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - agri-network

networks:
  agri-network:
    driver: bridge
